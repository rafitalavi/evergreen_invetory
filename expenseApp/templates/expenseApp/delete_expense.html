{% extends 'index.html' %}

{% block content %}
    <h2>Expense List</h2>
    <a href="{% url 'create_expense' %}" class="btn btn-success mb-3">Create New Expense</a>
    <table class="table table-bordered">
        <thead>
            <tr>
                <th>Name</th>
                <th>Amount</th>
                <th>Description</th>
                <th>Actions</th>
            </tr>
        </thead>
        <tbody>
            {% for expense in expenses %}
            <tr>
                <td>{{ expense.name }}</td>
                <td>{{ expense.amount }}</td>
                <td>{{ expense.description }}</td>
                <td>
                    <a href="{% url 'edit_expense' expense.pk %}" class="btn btn-warning btn-sm">Edit</a>
                    <a href="{% url 'delete_expense' expense.pk %}" class="btn btn-danger btn-sm">Delete</a>
                </td>
            </tr>
            {% empty %}
            <tr>
                <td colspan="4">No expenses found</td>
            </tr>
            {% endfor %}
        </tbody>
    </table>
{% endblock %}
