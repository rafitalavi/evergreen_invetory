<!DOCTYPE html>
{% load static %}
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}EverGreen - Cartoon Sales{% endblock %}</title>
    <!-- Bootstrap CSS -->
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">

    <!-- CSS Links -->
    <link rel="stylesheet" href="{% static 'css/style.css' %}">
    
    <!-- Tailwind / Bootstrap (Optional) -->
    <script src="https://cdn.tailwindcss.com"></script>
    
</head>
<body class="bg-gray-100">

    <!-- Navbar -->
    <nav class="bg-green-600 text-white p-4">
        <div class="container mx-auto flex justify-between items-center">
            <a href="#" class="text-2xl font-bold">EverGreen</a>
            <ul class="flex space-x-4">
                <li><a href="{% url 'product_list' %}" class="hover:text-yellow-300">Products</a></li>
                <li><a href="{% url 'customer_list' %}" class="hover:text-yellow-300">About</a></li>
                <li><a href="{% url 'category_list' %}" class="hover:text-yellow-300">Contact</a></li>
                <li><a href="{% url 'purchase_list' %}" class="hover:text-yellow-300">Purchase</a></li>
            </ul>
        </div>
    </nav>

    <!-- Main Content Block -->
    <main class="container mx-auto p-6">
        {% block content %}
        <!-- Content will be injected here in child templates -->
        {% endblock %}
    </main>

    <!-- Footer -->
    <footer class="bg-gray-800 text-white text-center p-4 mt-10">
        <p>&copy; 2025 EverGreen - Cartoon Sales. All Rights Reserved.</p>
    </footer>

</body>
<!-- Bootstrap JS -->
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
<script src="https://code.jquery.com/jquery-3.6.4.min.js"></script>
</html>
